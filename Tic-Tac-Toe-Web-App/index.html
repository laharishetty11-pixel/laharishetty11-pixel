<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Tic Tac Toe 🎮</h1>

    <div class="scoreboard">
      <p>❌ X : <span id="xScore">0</span></p>
      <p>⭕ O : <span id="oScore">0</span></p>
    </div>

    <div class="mode-select">
      <button onclick="setMode('player')">2 Players</button>
      <button onclick="setMode('ai')">Play vs AI</button>
    </div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <h2 id="status">Player X's Turn</h2>

    <div class="buttons">
      <button onclick="restartGame()">Restart</button>
      <button onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
